name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  vet-test-lint:
    name: go vet, go test, golangci-lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

      - name: golangci-lint
        # v7 is required for golangci-lint v2; v6 only supports v1.x, whose
        # binaries are built with an older Go and refuse to load a config
        # that targets go 1.27.
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.15.0

  e2e:
    name: scripts/e2e.sh
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: true

      - name: Run e2e
        run: bash scripts/e2e.sh
