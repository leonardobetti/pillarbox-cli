# GoReleaser configuration for pillarbox, PRD section 14: one static binary
# per target, archives plus a checksum file.
version: 2

project_name: pillarbox

builds:
  - id: pillarbox
    main: ./cmd/pillarbox
    binary: pillarbox
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/leonardobetti/pillarbox-cli/internal/cli.Version={{.Version}}
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - id: pillarbox
    formats:
      - tar.gz
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md

checksum:
  name_template: "checksums.txt"

changelog:
  disable: true
