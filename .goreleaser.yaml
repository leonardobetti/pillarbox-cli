# GoReleaser configuration for pillarbox, PRD section 14: one static binary
# per target, archives plus a checksum file.
version: 2

project_name: pillarbox

builds:
  - id: pillarbox
    main: ./cmd/pillarbox
    binary: pillarbox
    env:
      - CGO_ENABLED=0
    ldflags:
      - -s -w -X github.com/leonardobetti/pillarbox-cli/internal/cli.Version={{.Version}}
    goos:
      - darwin
      - linux
    goarch:
      - amd64
      - arm64

archives:
  - id: pillarbox
    formats:
      - tar.gz
    files:
      - LICENSE
      - README.md
      - CHANGELOG.md

checksum:
  name_template: "checksums.txt"

homebrew_casks:
  - name: pillarbox
    homepage: "https://github.com/leonardobetti/pillarbox-cli"
    description: "Encrypt and decrypt files in the terminal"
    license: "MIT"
    directory: Casks
    repository:
      owner: leonardobetti
      name: homebrew-tap
      branch: main
      token: "{{ .Env.HOMEBREW_TAP_TOKEN }}"
    hooks:
      post:
        install_steps: |
          on_macos do
            run "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "{{ "{{staged_path}}" }}/pillarbox"]
          end

changelog:
  disable: true
